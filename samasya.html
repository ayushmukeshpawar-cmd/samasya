<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Complaint Management System</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            gap: 20px; /* Gives spacing when both cards are open */
            flex-wrap: wrap;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .container.admin-width {
            max-width: 900px;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"], input[type="password"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px; /* Added separation for multiple buttons */
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        .hidden {
            display: none !important;
        }

        .switch-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .switch-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }

        /* Admin & User Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .filter-section select {
            width: auto;
            min-width: 200px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            background: #e2e8f0;
        }
    </style>
</head>
<body>

    <div id="loginCard" class="container">
        <h2 id="loginTitle">Employee Login</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username / ID</label>
                <input type="text" id="username" placeholder="Enter your ID (e.g., emp123)" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="switch-link">
            <a href="#" id="toggleRoleLink" onclick="toggleRole(event)">Login as Admin Instead</a>
        </div>
    </div>

    <div id="complaintCard" class="container hidden">
        <h2>Register a Complaint</h2>
        <form id="complaintForm" onsubmit="handleComplaintSubmit(event)">
            <div class="form-group">
                <label for="deptSelect">Select Department</label>
                <select id="deptSelect" required>
                    <option value="" disabled selected>-- Choose Department --</option>
                    <option value="System">System</option>
                    <option value="Hrd">Hrd</option>
                    <option value="Security">Security</option>
                    <option value="Erp/welfare">Erp/welfare</option>
                    <option value="Post">Post</option>
                    <option value="E and M">E and M (Electrical & Mechanical)</option>
                    <option value="Civil">Civil</option>
                    <option value="Medical">Medical</option>
                    <option value="Marketing and cells">Marketing and cells</option>
                    <option value="PRD">PRD</option>
                </select>
            </div>
            <div class="form-group">
                <label for="complaintText">What is the problem?</label>
                <textarea id="complaintText" placeholder="Describe your issue here in detail..." required></textarea>
            </div>
            <button type="submit">Send Complaint</button>
            <button type="button" onclick="showMyComplaints()" style="background-color: #475569;">View My Complaints</button>
            
            <div class="switch-link">
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </form>
    </div>

    <div id="myComplaintsCard" class="container hidden">
        <h2>My Complaints</h2>
        <table>
            <thead>
                <tr>
                    <th>Department</th>
                    <th>Complaint</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="myComplaintsBody">
                </tbody>
        </table>
    </div>

    <!-- ADMIN CARD (UPDATED WITH ACTION HEADER) -->
    <div id="adminCard" class="container admin-width hidden">
        <h2>Admin Dashboard (All Complaints)</h2>
        
        <div class="filter-section">
            <label for="adminFilter">Filter by Department:</label>
            <select id="adminFilter" onchange="filterComplaints()">
                <option value="All">All Departments</option>
                <option value="System">System</option>
                <option value="Hrd">Hrd</option>
                <option value="Security">Security</option>
                <option value="Erp/welfare">Erp/welfare</option>
                <option value="Post">Post</option>
                <option value="E and M">E and M</option>
                <option value="Civil">Civil</option>
                <option value="Medical">Medical</option>
                <option value="Marketing and cells">Marketing and cells</option>
                <option value="PRD">PRD</option>
            </select>
            <button onclick="logout()" style="width: auto; padding: 8px 15px; margin-left: auto; background: #dc2626;">Logout</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Employee</th>
                    <th>Department</th>
                    <th>Complaint Details</th>
                    <th>Status</th>
                    <th>Action</th> <!-- EXACT CHANGE 1: Added header row -->
                </tr>
            </thead>
            <tbody id="complaintTableBody">
                </tbody>
        </table>
    </div>

    <script>
        let currentRole = "employee";

        function toggleRole(e) {
            e.preventDefault();
            const title = document.getElementById("loginTitle");
            const link = document.getElementById("toggleRoleLink");
            
            if (currentRole === "employee") {
                currentRole = "admin";
                title.innerText = "Admin Login";
                link.innerText = "Login as Employee Instead";
            } else {
                currentRole = "employee";
                title.innerText = "Employee Login";
                link.innerText = "Login as Admin Instead";
            }
        }

        window.handleLogin = async function(e) {
            e.preventDefault();
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            if (currentRole === "admin") {
                if (user === "admin" && pass === "admin123") {
                    document.getElementById("loginCard").classList.add("hidden");
                    document.getElementById("adminCard").classList.remove("hidden");
                    loadComplaintsFromFirebase();
                } else {
                    alert("Wrong Admin Credentials");
                }
            } else {
                document.getElementById("loginCard").classList.add("hidden");
                document.getElementById("complaintCard").classList.remove("hidden");
            }
        }

        window.handleComplaintSubmit = async function(e) {
            e.preventDefault();
            const empId = document.getElementById("username").value;
            const dept = document.getElementById("deptSelect").value;
            const text = document.getElementById("complaintText").value;

            try {
                await addDoc(collection(db, "complaints"), {
                    employee: empId,
                    department: dept,
                    complaint: text,
                    status: "Pending",
                    createdAt: new Date()
                });
                alert("Complaint Submitted Successfully");
                document.getElementById("complaintForm").reset();
                
                // Live refresh the list if they currently have their table open
                if(!document.getElementById("myComplaintsCard").classList.contains("hidden")) {
                    loadMyComplaints(empId);
                }
            } catch(error) {
                console.error(error);
                alert("Error saving complaint");
            }
        }

        window.showMyComplaints = function() {
            const empId = document.getElementById("username").value;
            document.getElementById("myComplaintsCard").classList.remove("hidden");
            loadMyComplaints(empId);
        }

        function logout() {
            document.getElementById("complaintCard").classList.add("hidden");
            document.getElementById("myComplaintsCard").classList.add("hidden");
            document.getElementById("adminCard").classList.add("hidden");
            document.getElementById("loginCard").classList.remove("hidden");
            document.getElementById("loginForm").reset();
        }
    </script>

    <!-- FIREBASE AND SCRIPT BLOCK (UPDATED) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-analytics.js";
        import {
          getFirestore,
          collection,
          addDoc,
          getDocs,
          doc,
          updateDoc,
          deleteDoc, // EXACT CHANGE 2: Added deleteDoc import
          query,
          where
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAWa1flPYucGbdclwkurQyEnuMzGu3_pxE",
          authDomain: "samasya-71158.firebaseapp.com",
          projectId: "samasya-71158",
          storageBucket: "samasya-71158.firebasestorage.app",
          messagingSenderId: "834987874353",
          appId: "1:834987874353:web:53081574e451e64c7b1d10",
          measurementId: "G-1QF21PWB1W"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Making Firebase functions accessible to standard scope
        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.query = query;
        window.where = where;
        window.getDocs = getDocs;

        // Admin Status Update Engine
        window.updateStatus = async function(id, status) {
            try {
                await updateDoc(doc(db, "complaints", id), { status: status });
                alert("Status Updated");
            } catch(error) {
                console.error(error);
                alert(error.message);
            }
        }

        // EXACT CHANGE 3: Added the delete handler logic
        window.deleteComplaint = async function(id) {
            if (confirm("Are you sure you want to permanently delete this complaint?")) {
                try {
                    await deleteDoc(doc(db, "complaints", id));
                    alert("Complaint deleted successfully!");
                    loadComplaintsFromFirebase(); // Dynamic refresh
                } catch (error) {
                    console.error("Error deleting document: ", error);
                    alert("Failed to delete: " + error.message);
                }
            }
        }

        // FETCH ALL COMPLAINTS FOR ADMIN (EXACT CHANGE 4: Added dynamic delete button layout)
        window.loadComplaintsFromFirebase = async function() {
            const tableBody = document.getElementById("complaintTableBody");
            tableBody.innerHTML = "";

            const querySnapshot = await getDocs(collection(db, "complaints"));
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                tableBody.innerHTML += `
                    <tr>
                        <td>${doc.id}</td>
                        <td>${data.employee}</td>
                        <td><span class="badge">${data.department}</span></td>
                        <td>${data.complaint}</td>
                        <td>
                            <select onchange="updateStatus('${doc.id}', this.value)">
                                <option value="Pending" ${data.status=="Pending"?"selected":""}>Pending</option>
                                <option value="In Progress" ${data.status=="In Progress"?"selected":""}>In Progress</option>
                                <option value="Resolved" ${data.status=="Resolved"?"selected":""}>Resolved</option>
                            </select>
                        </td>
                        <td>
                            <button onclick="deleteComplaint('${doc.id}')" style="background-color: #dc2626; padding: 6px 12px; font-size: 13px; margin: 0; width: auto;">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        // FETCH SPECIFIC EMPLOYEE COMPLAINTS
        window.loadMyComplaints = async function(empId) {
            const complaintsBody = document.getElementById("myComplaintsBody");
            complaintsBody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>Loading data...</td></tr>";

            try {
                const q = query(collection(db, "complaints"), where("employee", "==", empId));
                const querySnapshot = await getDocs(q);
                
                complaintsBody.innerHTML = ""; 

                if (querySnapshot.empty) {
                    complaintsBody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>No complaints filed yet.</td></tr>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    let statusColor = "#d97706"; 
                    if (data.status === "In Progress") statusColor = "#2563eb";
                    if (data.status === "Resolved") statusColor = "#16a34a";

                    const row = `
                        <tr>
                            <td><span class="badge">${data.department}</span></td>
                            <td>${data.complaint}</td>
                            <td style="color: ${statusColor}; font-weight: bold;">${data.status || 'Pending'}</td>
                        </tr>
                    `;
                    complaintsBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error reading database collection:", error);
                complaintsBody.innerHTML = "<tr><td colspan='3' style='text-align:center; color:red;'>Database fetch failure.</td></tr>";
            }
        }
    </script>
</body>
</html>
